name: update-prices

on:
  schedule:
    # 23:30 UTC Mon–Fri = 04:30 Almaty Tue–Sat, after the New York close
    - cron: "30 23 * * 1-5"
    # backups: GitHub sometimes delays or drops scheduled runs; re-running is harmless
    - cron: "17 0 * * 2-6"
    - cron: "41 1 * * 2-6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python update_prices.py
      - name: Headlines
        run: python update_news.py
        continue-on-error: true
      - name: Commit prices and headlines
        run: |
          git config user.name "market-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "prices $(date -u +%Y-%m-%d)"
          git push
      - name: Fundamentals (Finnhub)
        run: python -u update_fundamentals.py
        continue-on-error: true
        timeout-minutes: 12
        env:
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          FMP_KEY: ${{ secrets.FMP_KEY }}
          FRED_KEY: ${{ secrets.FRED_KEY }}
      - name: Commit fundamentals
        if: always()
        run: |
          git add data
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "fundamentals $(date -u +%Y-%m-%d)"
          git pull -q --rebase && git push
